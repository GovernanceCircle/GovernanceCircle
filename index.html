<body>
<header class="topbar wrap"><button class="brand" onclick="go('home')"><span class="logo"></span><span>Governance <b>Circle</b></span></button><button class="mobile" onclick="toggleNav()">☰</button><nav class="nav" id="nav"><button onclick="go('home')">Home</button><button onclick="go('discussions')">Discussions</button><button onclick="openModal()">Ask a question ↗</button><button onclick="go('resources')">Resources</button><button onclick="notify('Events are coming soon.')">Events</button><button class="sign" onclick="notify('Sign in can be connected later.')">Sign in</button><button class="join" onclick="notify('Membership signup can be connected later.')">Join the Circle</button></nav></header>
<div id="app"></div>
<footer><div class="wrap footer-grid"><div class="footer-brand"><button class="brand" onclick="go('home')"><span class="logo"></span><span>Governance <b>Circle</b></span></button><p>Connecting governance professionals.<br>Sharing knowledge. Strengthening practice.</p></div><div class="footer-col"><b>Community</b><button onclick="go('discussions')">Discussions</button><button onclick="openModal()">Ask a question</button><button onclick="notify('Member profiles are coming soon.')">Members</button></div><div class="footer-col"><b>Resources</b><button onclick="go('resources')">Guides & playbooks</button><button onclick="go('resources')">Templates</button><button onclick="notify('Events are coming soon.')">Events</button></div><div class="footer-col"><b>About</b><button onclick="notify('Our principles are on the homepage.')">Our principles</button><button onclick="notify('Contact details are coming soon.')">Contact</button></div><div class="subscribe"><span>Stay informed</span><p>Occasional insights and updates for governance professionals.</p><button onclick="notify('Subscription form ready to connect.')">Subscribe to updates ↗</button></div></div><div class="wrap footer-bottom"><span>© 2026 Governance Circle</span><span>Not legal, financial or regulatory advice.</span></div></footer>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const data=[
 {t:'How should delegated Risk Committee decisions be reported to the Board?',x:'A practical discussion about giving the Board enough visibility without asking it to re-approve a decision already taken within delegated authority.',c:'Board reporting',a:27,n:'AM'},
 {t:'What makes a useful committee minute?',x:'What should be captured, what should be left out, and how can minutes help an organisation track accountability?',c:'Board effectiveness',a:18,n:'SR'},
 {t:'Managing confidential information in board papers',x:'How do governance teams balance helpful context with the need to keep commercially sensitive information tightly controlled?',c:'Confidentiality',a:31,n:'MP'},
 {t:'When should a policy exception go to the Board?',x:'A peer exchange on escalation thresholds, reporting routes and documenting exceptions clearly.',c:'Risk & compliance',a:14,n:'RT'},
 {t:'Designing an annual governance calendar',x:'Approaches for coordinating Board, committee, AGM, reporting and policy review cycles.',c:'Board effectiveness',a:22,n:'EC'},
 {t:'How do you structure a decision log?',x:'Practical ideas for recording decisions, delegated authority, conditions, owners and follow-up dates.',c:'Board reporting',a:9,n:'NW'}
];
function card(d,i){return `<article class="card" onclick="discussion(${i})"><div class="card-art ${i%3===0?'one':i%3===1?'two':'three'}"><span class="card-number">0${i+1}</span><span class="card-chip">${i<3?'Featured':'Practical'}</span><span class="mini-ring"></span></div><div class="card-body"><span class="tag">${d.c}</span><h3>${d.t}</h3><p>${d.x}</p><div class="meta"><span>${d.n} · ${d.a} answers</span><span>↗</span></div></div></article>`}
function home(){return `<main><section class="hero wrap"><div><div class="eyebrow"><i></i> The professional governance community</div><h1>Practical governance knowledge, <em>shared by professionals.</em></h1><p class="lead">Ask real-world company secretarial and governance questions. Learn from experienced peers who have dealt with similar situations.</p><div class="actions"><button class="button" onclick="openModal()">Ask a question ↗</button><button class="link" onclick="go('discussions')">Explore discussions ›</button></div><div class="people"><div class="avatars"><span>AM</span><span>SR</span><span>KL</span><span>+8k</span></div><span>Trusted by company secretaries, board advisers and governance professionals.</span></div></div><div class="hero-art"><span class="grid"></span><span class="ring outer"></span><span class="ring main"></span><span class="ring inner"></span><div class="note top"><small>BOARD NOTE</small><strong>Visibility without<br>re-approval.</strong><span class="line"></span><span class="line short"></span></div><div class="note bottom">◈ Practical perspectives <b>not legal advice.</b></div></div></section><section class="band"><div class="wrap band-in"><span>◈ Professional perspectives<br><b>not legal advice</b></span><p>A thoughtful place to ask, compare and document what good governance looks like in practice.</p><span>01 ─── 04</span></div></section><section class="section wrap"><div class="section-head"><div><span class="label">Learn from the room</span><h2>Featured discussions</h2></div><button class="link" onclick="go('discussions')">View all discussions ›</button></div><div class="cards">${data.slice(0,3).map(card).join('')}</div></section><section class="section resources"><div class="wrap"><div class="section-head"><div><span class="label">Practical resources</span><h2>Make good governance<br>easier to practise.</h2></div><button class="link" onclick="go('resources')">Browse the library ›</button></div><div class="resource-grid"><button class="resource r1" onclick="notify('Board paper checklist coming soon.')"><span class="resource-icon">▣</span><small>Template</small><h3>Board paper checklist</h3><p>Help papers arrive clear, focused and decision-ready.</p><span class="arrow">↗</span></button><button class="resource r2" onclick="notify('Committee reporting guide coming soon.')"><span class="resource-icon">◌</span><small>Guide</small><h3>Committee reporting guide</h3><p>Turn delegated decisions into useful Board reporting.</p><span class="arrow">↗</span></button><button class="resource r3" onclick="notify('Minute-writing essentials coming soon.')"><span class="resource-icon">✓</span><small>Playbook</small><h3>Minute-writing essentials</h3><p>Capture decisions, actions and accountability with confidence.</p><span class="arrow">↗</span></button></div></div></section><section class="wrap cta"><div><span class="label" style="color:#d5a62d">Start a conversation</span><h2>Have a governance question?</h2><p>Ask anonymously or under your professional profile. The community responds with practical perspectives, never legal advice.</p></div><button class="button gold" onclick="openModal()">Ask the community ↗</button></section></main>`}
function discussions(){return `<main class="page wrap"><div class="page-head"><div><span class="label">The forum</span><h1>Ask better questions.<br><em>Learn from the room.</em></h1><p class="lead">Browse practical conversations from company secretaries and governance professionals.</p></div><button class="button" onclick="openModal()">Ask a question ↗</button></div><div class="toolbar"><label>⌕ <input id="search" oninput="filterCards()" placeholder="Search discussions"></label><select id="filter" onchange="filterCards()"><option>All topics</option><option>Board reporting</option><option>Board effectiveness</option><option>Confidentiality</option><option>Risk & compliance</option></select></div><div class="cards" id="cardList">${data.map(card).join('')}</div></main>`}
function resources(){return `<main class="page wrap"><div class="page-head"><div><span class="label">The library</span><h1>Tools for the work<br><em>behind the Boardroom.</em></h1><p class="lead">Templates, checklists and practical guides designed for the everyday rhythm of governance.</p></div></div><div class="resource-grid"><button class="resource r1" onclick="notify('Resource coming soon.')"><span class="resource-icon">▣</span><small>Template</small><h3>Board paper checklist</h3><p>Help papers arrive clear, focused and decision-ready.</p></button><button class="resource r2" onclick="notify('Resource coming soon.')"><span class="resource-icon">◌</span><small>Guide</small><h3>Committee reporting guide</h3><p>Turn delegated decisions into useful Board reporting.</p></button><button class="resource r3" onclick="notify('Resource coming soon.')"><span class="resource-icon">✓</span><small>Playbook</small><h3>Minute-writing essentials</h3><p>Capture decisions, actions and accountability with confidence.</p></button></div></main>`}
function go(view){document.getElementById('nav').classList.remove('open');document.getElementById('app').innerHTML=view==='home'?home():view==='discussions'?discussions():resources();window.scrollTo({top:0,behavior:'smooth'})}
function toggleNav(){document.getElementById('nav').classList.toggle('open')}
function filterCards(){const q=(document.getElementById('search').value||'').toLowerCase(),f=document.getElementById('filter').value;document.getElementById('cardList').innerHTML=data.filter(d=>(f==='All topics'||d.c===f)&&(`${d.t} ${d.x} ${d.c}`).toLowerCase().includes(q)).map(card).join('')||'<p>No discussions found.</p>'}
function discussion(i){const d=data[i];document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><button class="close" onclick="closeModal()">×</button><span class="tag">${d.c}</span><h2>${d.t}</h2><p>${d.x}</p><div class="notice"><b>Practical perspectives, not legal advice.</b><br>Responses should begin with “I would look at…” or “I suggest…”.</div><p><b>I would look at</b> the delegated authority framework first, then give the Board a concise summary of the decision, the authority relied on and any conditions or follow-up actions.</p><button class="button" onclick="closeModal();openModal()">Share your perspective ↗</button></div></div>`}
function openModal(){document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()"><button class="close" onclick="closeModal()">×</button><span class="label">Start a conversation</span><h2>Ask the community</h2><p>Share the context, not confidential details. This is professional discussion, not legal advice.</p><form onsubmit="submitQuestion(event)"><label>Question title<input required placeholder="e.g. How should a delegated decision be reported?"></label><label>Topic<select><option>Board reporting</option><option>Board effectiveness</option><option>Confidentiality</option><option>Risk & compliance</option></select></label><label>Your question<textarea required placeholder="Explain the practical context without naming people or organisations..."></textarea></label><label class="check"><input type="checkbox" required> I confirm I have removed confidential and personally identifiable information.</label><div class="notice">This platform is for professional discussion and shared experience only. It is not legal, financial or regulatory advice.</div><button class="button" type="submit">Publish question ↗</button></form></div></div>`}
function submitQuestion(e){e.preventDefault();closeModal();notify('Your question is ready to connect to a database.')}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function notify(text){document.getElementById('toastRoot').innerHTML='<div class="toast">✓ '+text+'</div>';setTimeout(()=>document.getElementById('toastRoot').innerHTML='',3000)}
go('home');
</script>
